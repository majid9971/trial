name: Use Custom Action

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  run-custom-action:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Use the custom action
      - name: Greet User
        uses: majid9971/GreetAction/.github/actions/my-action@v1.0.0  # Replace with your repo and release tag
        with:
          name: "Another User"  # Input parameter for the action
